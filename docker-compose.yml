services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: syarihub
      POSTGRES_USER: syarihub
      POSTGRES_PASSWORD: syarihub
    ports:
      - "5432:5432"
    volumes:
      - syarihub_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syarihub -d syarihub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  syarihub_postgres:
